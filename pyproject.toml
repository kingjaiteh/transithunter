[project]
name = "transithunter"
version = "0.0.1"
description = "Detecting and vetting exoplanet transits in Kepler light curves"
# 3.11 floor so training scripts also run unmodified on Kaggle
requires-python = ">=3.11"
dependencies = [
    # Phase 0 / 1: fetch, fold, feature table
    "lightkurve>=2.5",
    "astropy>=6.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.9",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "mlflow>=2.17",
    "pydantic>=2.8",
    "typer>=0.15",
]

[project.optional-dependencies]
# Phase 2: CNN. Install the CUDA build separately on the local RTX 2060:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
train = ["torch>=2.5"]
# Phase 1: validation on the assembled training table
validate = ["great-expectations>=1.0"]
# Phase 3: serving
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "jupyter>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transithunter"]

[tool.ruff]
line-length = 100
